<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        * {
            transition: all 0.2s;
        }
        body {
            font-family: "Open Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
            margin: 0;
            background-image: url(richard-horvath-_nWaeTF6qo0-unsplash.jpg);
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .contact_form {
            padding: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 30px;
            border: 1px;
            background-color: rgba(255, 255, 255, 0.211);
            backdrop-filter: blur(10px);
            border-radius: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
            font-family: "Open Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 600;
            font-style: normal;
            font-variation-settings: 100;
        }
        input {
            border: none;
            border-radius: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: rgb(90, 90, 90);
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
        }
        textarea {
            border: none;
            border-radius: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: rgb(90, 90, 90);
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
        }

        textarea::placeholder {
            font-family: "Open Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        input::placeholder {
            font-family: "Open Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        .contact_but {
            border: none;
            border-radius: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: rgb(90, 90, 90);
            padding: 12px;
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
            font-family: "Open Sans", sans-serif;
            font-optical-sizing: auto;
            font-weight: 500;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        .contact_but:hover {
            border: none;
            border-radius: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            color: rgb(90, 90, 90);
            padding: 12px;
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
        }
        .contact_but:active {
            border: none;
            border-radius: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            color: rgb(90, 90, 90);
            padding: 12px;
            cursor: pointer;
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
        }
        input:focus,
        textarea:focus {
            outline: none;
            border: none;
            border-radius: 20px;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            color: rgb(90, 90, 90);
            border-top: 1px solid rgba(255, 255, 255, 0.27);
            border-left: 1px solid rgba(255, 255, 255, 0.27);
            box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.502);
        }
    </style>
</head>
<body>
    <form action="" id="form" class="contact_form">
        <input type="text" id="name" class="contact_input" required name="name" placeholder="Enter first name" />
        <input type="text" id="lastname" class="contact_input" required name="lastname" placeholder="Enter last name" />
        <input type="email" id="email" class="contact_input" required name="email" placeholder="Enter email" />
        <input type="password" id="password" class="contact_input" required name="password" placeholder="Enter password" />
        <button id="button" class="contact_but" type="submit">Register</button>
    </form>
    <script src="script1.js"></script>
</body>
</html>
