<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Desserts Store</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div class="container">
            <main class="products-section">
                <h1>Desserts</h1>
                <div class="products-grid" id="products-grid"></div>
            </main>

            <aside class="cart-section">
                <h2>Your Cart (<span id="cart-count">0</span>)</h2>

                <div id="cart-empty" class="cart-empty">
                    <p>Your added items will appear here</p>
                </div>

                <div id="cart-content" class="cart-content hidden">
                    <div id="cart-items"></div>

                    <div class="cart-total">
                        <span>Order Total</span>
                        <strong id="total-price">$0.00</strong>
                    </div>

                    <button id="confirm-btn" class="btn-confirm">Confirm
                        Order</button>
                </div>
            </aside>
        </div>

        <div id="modal" class="modal hidden">
            <div class="modal-content">
                <h2>Order Confirmed</h2>
                <p>We hope you enjoy your food!</p>
                <div id="modal-items" class="modal-items"></div>
                <button id="new-order-btn" class="btn-confirm">Start New
                    Order</button>
            </div>
        </div>

        <script src="script.js"></script>
    
    </body>
</html>
